            color: #ffd166;
        }

        .hero {

        }

        .hero p {
            font-size: 20px;

            background: white;

        .facility {

            padding: 25px;
            width: 220px;
            border-radius: 8px;
        }

        /* Contact */
        .contact {
            background-color: white;
        }

        .contact p {
            margin: 10px 0;
            font-size: 17px;
        }

        /* Footer */
        footer {
            background-color: #12355b;
            color: white;
            text-align: center;
            padding: 20px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 15px;
            }

            nav ul {
                flex-direction: column;

                gap: 10px;
            }

            .hero h1 {
                font-size: 35px;
            }

            .hero p {
                font-size: 17px;
            }
        }
    </style>
</head>
